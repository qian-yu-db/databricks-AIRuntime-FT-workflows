# =============================================================================
# Accelerate + FSDP launcher config. Used by the 8xH100 full fine-tune: run_sweep.py
# emits `accelerate launch --config_file accelerate_fsdp.yaml ...` whenever
# grid.yaml sets num_accelerators > 1. Must agree with axolotl_base.yaml's fsdp
# block on the wrap class (Qwen3DecoderLayer).
# =============================================================================
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
use_cpu: false
machine_rank: 0
num_machines: 1
num_processes: 8                       # match compute.num_accelerators
rdzv_backend: static
same_network: true

fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen3DecoderLayer
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_offload_params: false
  fsdp_use_orig_params: true
